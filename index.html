<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">👁</text></svg>'>
<title>TAMPERED EDEN — RUN #45764</title>
<style>
:root{
  --bg:#05080a; --panel:#070b0e; --ink:#c8dfd0; --dim:#5c7264;
  --grn:#5fe08d; --grn-soft:rgba(95,224,141,.14); --grn-line:rgba(95,224,141,.38);
  --red:#f4756a; --red-line:rgba(244,117,106,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Apple SD Gothic Neo","Noto Sans KR",monospace;
  font-size:15.5px; line-height:1.85; letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#wrap{max-width:720px;margin:0 auto;padding:28px 14px 60px}

/* ---------- 시스템창 프레임 ---------- */
#stage{
  position:relative; background:var(--panel);
  border:1px solid var(--grn-line); border-radius:6px;
  padding:34px 30px 40px; min-height:70vh;
  box-shadow:0 0 30px rgba(95,224,141,.05), inset 0 0 60px rgba(95,224,141,.03);
}
#stage::before{content:""; position:absolute; inset:7px; border:1px solid rgba(95,224,141,.14);
  border-radius:4px; pointer-events:none;}
#stage::after{content:""; position:absolute; inset:0; pointer-events:none; border-radius:6px;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);}
.deco{position:absolute; pointer-events:none; z-index:2}
.deco.slash{width:64px;height:8px;
  background:repeating-linear-gradient(-60deg, var(--grn-line) 0 5px, transparent 5px 11px);
  opacity:.6}
.deco.s-tl{top:-4px;left:22px} .deco.s-br{bottom:-4px;right:22px}
.deco.bar{height:3px;background:var(--grn-line);opacity:.55}
.deco.b-tl{top:-2px;left:96px;width:110px;clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.deco.b-tr{top:-2px;right:96px;width:110px;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%)}
.deco.b-bl{bottom:-2px;left:96px;width:70px} .deco.b-br{bottom:-2px;right:96px;width:70px}
.deco.gem{top:-7px;left:50%;transform:translateX(-50%);width:120px;height:12px;
  background:var(--grn-line);opacity:.7;
  clip-path:polygon(10% 50%,22% 0,78% 0,90% 50%,78% 100%,22% 100%)}
.deco.dot{top:-4px;width:6px;height:6px;border-radius:50%;background:var(--grn-line)}
.deco.d-l{left:calc(50% - 78px)} .deco.d-r{right:calc(50% - 78px)}

/* ---------- HUD ---------- */
#hud{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  border-bottom:1px solid rgba(95,224,141,.16); padding-bottom:12px; margin-bottom:26px;
  font-size:12.5px; color:var(--dim); letter-spacing:.12em;
}
#hud .l b{color:var(--grn);font-weight:600}
#hud .r{opacity:.7}
#hud .stat{width:100%;font-size:11.5px;letter-spacing:.14em;color:var(--dim);margin-top:2px}
#hud .stat b{color:var(--grn);font-weight:600}

/* ---------- 본문 ---------- */
.ln{margin:0 0 14px; opacity:0; animation:up .5s ease forwards; white-space:pre-line}
.ln.q{color:var(--dim)}
.ln.say{color:var(--grn); padding-left:14px; border-left:2px solid var(--grn-line)}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;opacity:1}}

.sysbox{
  border:1px solid var(--grn-line); border-radius:4px; background:rgba(95,224,141,.04);
  padding:16px 20px; margin:18px 0; color:var(--grn); white-space:pre-line;
  opacity:0; animation:up .5s ease forwards; position:relative;
}
.sysbox .hd{font-size:11px;letter-spacing:.22em;color:var(--dim);margin-bottom:8px}
.sysbox.warn{border-color:var(--red-line);color:var(--red);background:rgba(244,117,106,.05)}
.sysbox.corrupt{animation:jit .12s steps(2) infinite;
  text-shadow:1px 0 rgba(244,117,106,.7), -1px 0 rgba(95,224,141,.7)}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}

/* 흔적 (다른 대상의 낙서) */
.trace{
  border-left:2px solid var(--red-line); padding:8px 14px; margin:16px 0;
  color:var(--red); opacity:0; animation:up .5s ease forwards; white-space:pre-line;
  font-size:14px; letter-spacing:.05em;
}
.trace .hd{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:4px}

/* ---------- 버튼 ---------- */
.btn{
  display:block;width:100%;text-align:left;
  background:transparent;border:1px solid var(--grn-line);border-radius:4px;
  padding:12px 16px;margin-top:10px;font:inherit;color:var(--grn);
  cursor:pointer;transition:background .12s;letter-spacing:.03em;
  opacity:0;animation:up .5s ease forwards;
}
.btn:hover{background:var(--grn-soft)}
.btn:focus-visible{outline:1px solid var(--grn);outline-offset:2px}
.btn .arw{opacity:.6;margin-right:8px}
.btn.dim{color:var(--dim);border-color:rgba(95,224,141,.18)}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.danger:hover{background:rgba(244,117,106,.08)}
.btn.stamp{
  text-align:center;color:var(--red);border-color:var(--red-line);
  font-weight:700;letter-spacing:.3em;padding:14px}
.btn.stamp:hover{background:rgba(244,117,106,.08)}
.btn.ghost{border:none;color:var(--dim);text-align:center;font-size:13px}

/* 책상 위 도장 (비인터랙티브) */
.stampview{
  display:inline-block; margin:4px 0 10px 12px;
  border:3px solid var(--red); border-radius:4px; color:var(--red);
  padding:5px 18px; font-weight:800; letter-spacing:.3em; font-size:19px;
  transform:rotate(-6deg); opacity:0; animation:up .5s ease forwards;
  pointer-events:none; user-select:none;
}
/* 도장 찍힘 */
.stamped{position:relative}
.stamped::after{
  content:"착오 확인"; position:absolute; right:18px; top:50%;
  transform:translateY(-50%) rotate(-12deg);
  border:3px solid var(--red); color:var(--red); border-radius:4px;
  padding:4px 12px; font-weight:800; letter-spacing:.25em; font-size:18px;
  animation:thunk .25s cubic-bezier(.2,1.8,.4,1) both;
}
@keyframes thunk{from{transform:translateY(-50%) rotate(-12deg) scale(2.4);opacity:0}
  to{transform:translateY(-50%) rotate(-12deg) scale(1);opacity:1}}

/* 엔딩 도장판 */
.stampboard{margin-top:26px}
.stampboard .lbl{font-size:11.5px;letter-spacing:.18em;color:var(--dim);margin-bottom:10px}
.stampgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{
  aspect-ratio:1; border:1.5px dashed rgba(95,224,141,.25); border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11px;color:var(--dim);padding:6px;
}
.slot.got{
  border:2.5px solid var(--red); color:var(--red);
  font-weight:800; transform:rotate(-7deg); font-size:12px; line-height:1.3;
  background:rgba(244,117,106,.07);
}
.slot.hidden-slot{letter-spacing:.2em}
.stampgrid .slot.got{cursor:pointer}
.fragslot.got{cursor:pointer}
.fragrow{display:flex;gap:10px;margin-top:8px}
.fragslot{flex:1;border:1px dashed rgba(95,224,141,.25);border-radius:4px;padding:7px 10px;
  font-size:11.5px;color:var(--dim);text-align:center}
.fragslot.got{border-style:solid;border-color:var(--grn-line);color:var(--grn)}
.ledgergrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ledgergrid .fragslot{text-align:left;line-height:1.5}
.fragslot.verify{border-color:var(--red-line);color:var(--red)}
/* 각성 후 — 세계의 껍데기가 얇아진다 */
body.awake .deco.gem{opacity:.18}
body.awake #stage::after{background:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 5px)}
body.awake #stage{box-shadow:0 0 30px rgba(95,224,141,.03), inset 0 0 60px rgba(95,224,141,.015)}

/* 엔딩 대형 스탬프 */
.endstamp{
  position:absolute; top:40px; right:26px; width:110px; height:110px; border-radius:50%;
  border:3.5px solid var(--red); color:var(--red);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-weight:800;font-size:16px;line-height:1.3;transform:rotate(-10deg);
  background:rgba(244,117,106,.06); pointer-events:none;
  animation:thunk2 .3s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes thunk2{from{transform:rotate(-10deg) scale(2);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}

/* ---------- 리셋 컷 (암전) ---------- */
#noise{position:fixed;inset:0;z-index:60;display:none;background:#000}
#noiseTxt{position:fixed;z-index:61;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--grn);font-size:15px;letter-spacing:.15em;text-align:center;white-space:pre-line;
  text-shadow:0 0 12px rgba(95,224,141,.5);
  animation:flick 1.2s steps(1) infinite}
@keyframes flick{0%{opacity:1}92%{opacity:1}94%{opacity:.25}96%{opacity:1}98%{opacity:.6}100%{opacity:1}}
#noiseTxt.frag{animation:none;color:rgba(95,224,141,.8);font-size:14px;letter-spacing:.22em;
  text-shadow:1px 0 rgba(244,117,106,.4),-1px 0 rgba(95,224,141,.4)}
#noiseTxt.big{animation:none;color:var(--red);font-size:26px;letter-spacing:.35em;font-weight:700;
  text-shadow:2px 0 rgba(95,224,141,.5),-2px 0 rgba(244,117,106,.5)}

/* ---------- 가짜 에러 ---------- */
#crash{position:fixed;inset:0;z-index:80;display:none;background:#0d0f12;color:#c9ced6;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
#crash .box{max-width:520px;margin:26vh auto 0;padding:0 24px}
#crash h1{font-size:21px;font-weight:600;margin:0 0 14px;letter-spacing:0}
#crash .code{font-family:"SF Mono",ui-monospace,Menlo,monospace;color:#8a919c;font-size:14px;margin-bottom:30px}
#crash button{background:#2e5fb8;color:#fff;border:none;border-radius:4px;padding:9px 22px;
  font:inherit;font-size:14px;cursor:pointer}
#crash .foot{position:fixed;bottom:18px;left:0;right:0;text-align:center;
  color:#3a3f47;font-size:11.5px;letter-spacing:.04em}

/* 붕괴 */
.breaking{animation:brk .10s steps(2) infinite}
@keyframes brk{
  0%{transform:translate(0,0);clip-path:inset(0)}
  33%{transform:translate(-4px,2px);clip-path:inset(8% 0 12% 0)}
  66%{transform:translate(4px,-3px);clip-path:inset(40% 0 5% 0)}
  100%{transform:translate(-2px,1px);clip-path:inset(0 0 55% 0)}}

/* 타이틀 */
.title-eyebrow{font-size:11px;letter-spacing:.35em;color:var(--dim);margin-bottom:18px;
  opacity:0;animation:up .5s ease forwards}
h1.title{font-size:34px;letter-spacing:.12em;color:var(--grn);margin:0 0 6px;font-weight:700;
  text-shadow:0 0 18px rgba(95,224,141,.35);opacity:0;animation:up .5s ease forwards}
.title-sub{color:var(--dim);font-size:13px;letter-spacing:.2em;margin-bottom:30px;
  opacity:0;animation:up .5s ease forwards}
.title-sub .broke{color:var(--red);text-shadow:1px 0 rgba(95,224,141,.5)}
.hr{border:none;border-top:1px solid rgba(95,224,141,.14);margin:24px 0}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <i class="deco slash s-tl"></i><i class="deco slash s-br"></i>
    <i class="deco bar b-tl"></i><i class="deco bar b-tr"></i>
    <i class="deco bar b-bl"></i><i class="deco bar b-br"></i>
    <i class="deco gem"></i><i class="deco dot d-l"></i><i class="deco dot d-r"></i>
    <div id="hud"></div>
    <div id="screen"></div>
  </div>
</div>
<div id="noise"></div>
<div id="noiseTxt" style="display:none"></div>
<div id="crash"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);

/* ================================================================
   저장 — 캠페인은 리셋을 건너 이어진다
================================================================ */
const SKEY='te2_save';
function load(){
  const d={run:122,stage:0,revealed:false,tut:false,
    susp:0,stab:10,expo:0,prog:0,totalReports:0,lastJobs:[],lastIncs:[],echo:false,statIntro:false,
    reports:0,records:0,bowed:0,foundTraces:false,betrayUnlocked:false,revealReady:false,
    trio:0,endings:[],frags:[],traces:[],ignored:0,
    readTraces:[],warmSeen:[],corrVisits:0,lastClaims:[],scribeSeen:false,scribeNote:false,ledgerS:[],ledgerF:[],
    seenFrags:[],claimsSeen:[],claimsTwice:[],marginKept:false,recordGone:false,saltBack:false,lastCut:{},pressSeen:[]};
  try{return Object.assign(d,JSON.parse(localStorage.getItem(SKEY))||{});}catch(e){return d;}
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV));}catch(e){}}
let SV=load();

/* 회차 내 상태 (리셋마다 초기화) */
let G={day:1,job:null,ignoredHere:0};

/* ================================================================
   렌더 헬퍼
================================================================ */
let seq=0, slowSeq=false;
function dl(){return 'style="animation-delay:'+(seq++*(slowSeq?300:140))+'ms'+(slowSeq?';animation-duration:.9s':'')+'"';}
function P(t,cls){return '<p class="ln '+(cls||'')+'" '+dl()+'>'+t+'</p>';}
function BOX(t,cls,hd,id){return '<div class="sysbox '+(cls||'')+'" '+dl()+(id?' id="'+id+'"':'')+'>'+(hd?'<div class="hd">'+hd+'</div>':'')+t+'</div>';}
function TRACE(t){return '<div class="trace" '+dl()+'><div class="hd">긁힌 글씨</div>'+t+'</div>';}
function BTN(t,id,cls){return '<button class="btn '+(cls||'')+'" id="'+id+'" '+dl()+'><span class="arw">→</span>'+t+'</button>';}
function screen(html,hudTxt){
  seq=0;
  try{document.body.classList[(SV.stage>=4||SV.revealed)?'add':'remove']('awake');}catch(e){}
  $('#hud').innerHTML=hudTxt!==undefined?hudTxt:hudDefault();
  $('#screen').innerHTML=html;
  window.scrollTo(0,0);
}
function hudDefault(){
  let h='<span class="l"><b>근무 '+G.day+'일차</b> · '+(G.job?G.job.loc:'에덴')+'</span><span class="r">AUDIT #45764</span>';
  if(SV.stage>=2) h+='<span class="stat">의심 <b>'+SV.susp+'</b> · 안정 <b>'+SV.stab+'</b></span>';
  return h;
}

/* ---------- 사운드 (도장 전용) ---------- */
let AC=null;
function thud(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const len=Math.floor(AC.sampleRate*.06), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g2=AC.createGain();
    f.type='bandpass'; f.frequency.value=1600; f.Q.value=.7;
    g2.gain.setValueAtTime(.9,t); g2.gain.exponentialRampToValueAtTime(.001,t+.08);
    s.buffer=buf; s.connect(f); f.connect(g2); g2.connect(AC.destination); s.start(t);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(50,t+.15);
    g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.32);
  }catch(e){}
}

/* ================================================================
   소설 단서 파편 — 작은 것만. 큰 단서 금지.
================================================================ */
const FRAGS=[
'기록해 두지.','허가 시간 밖의 음악.','설명하지 마. 본 것만 말해.','파장 무렵의 시장.',
'단내가 먼저 온다.','사과 한 알','15:00','편차 +2초','라테는, 달았다.','바닐라 빈','배수구',
'…아는 분 같아서.','배수구로 들어갔겠지.','얘야, 물건이 그냥 없어지는 법은 없단다.',
'지루하시겠습니다.','모레 자정입니다.','식사요, 대장.','팔 거야, 살 거야?',
'오작동 기록 없음.','깨끗해도 너무 깨끗해.','일요일 밤이다.'
];
function flashText(txt,cls,ms,done){
  const bk=$('#noise'), tx=$('#noiseTxt');
  bk.style.display='block';
  tx.textContent=txt; tx.classList.add(cls); tx.style.display='flex';
  setTimeout(()=>{ tx.style.display='none'; tx.classList.remove(cls); tx.textContent='';
    setTimeout(()=>{ bk.style.display='none'; done&&done(); },70);
  },ms);
}

/* 대기 or 탭 스킵 */
function delayOrTap(ms,fn){
  let done=false;
  const go=()=>{ if(done)return; done=true;
    try{$('#stage').removeEventListener('click',go);}catch(e){}
    fn(); };
  setTimeout(()=>{ if(!done){try{$('#stage').addEventListener('click',go);}catch(e){}} },0);
  setTimeout(go,ms);
}

/* ---------- 리셋 컷 ---------- */
function fragFlash(done){
  /* 미독 우선 — 스치는 것들도 결국 전부 스친다 */
  const unread=FRAGS.map((_,x)=>x).filter(x=>!SV.seenFrags.includes(x));
  const i=unread.length?unread[Math.floor(Math.random()*unread.length)]:Math.floor(Math.random()*FRAGS.length);
  if(!SV.seenFrags.includes(i)){SV.seenFrags.push(i);save();}
  const t=FRAGS[i];
  flashText(t,'frag',Math.min(300,120+t.length*7),done);
}
function glitchCut(done){
  const st=$('#stage'), bk=$('#noise');
  st.classList.add('breaking');
  setTimeout(()=>{
    st.classList.remove('breaking');
    if(SV.revealReady){ SV.revealReady=false; SV.revealed=true; SV.echo=true; save();
      flashText('회차 125','big',800,done); return; }
    if(SV.stage>=3 && Math.random()<0.4){
      const soft='기억 완화 적용률 저하. 원인 불명.';
      flashText(soft,'frag',Math.min(300,120+soft.length*7),done); return; }
    if(SV.stage>=1){ fragFlash(done); return; }
    bk.style.display='block';
    setTimeout(()=>{ bk.style.display='none'; done&&done(); },160);
  },260);
}
function blackout(lines,stepMs,done){
  const bk=$('#noise'), tx=$('#noiseTxt');
  bk.style.display='block'; tx.style.display='flex';
  let i=0;
  (function step(){
    if(i<lines.length){ tx.textContent=lines[i++]; setTimeout(step,stepMs); }
    else{ bk.style.display='none'; tx.style.display='none'; tx.textContent=''; done&&done(); }
  })();
}

/* ================================================================
   리셋 — 회차가 넘어간다. 캠페인은 이어진다.
================================================================ */
function bumpRun(){
  SV.run++;
  if(SV.run>=125 && !SV.revealed && !SV.revealReady) SV.revealReady=true;
}
function reset(){
  bumpRun();
  SV.prog=(SV.prog||0)+1;
  if(SV.stage<4) SV.stage=Math.min(4,1+Math.floor(SV.prog/2));
  save();
  glitchCut(()=>{
    G={day:1,job:null,ignoredHere:0};
    if(SV.stage>=4) hubMorning();
    else runMorning();
  });
}

/* ================================================================
   콜드 오픈 / 타이틀
================================================================ */
function coldOpen(){
  screen('','');
  let scar=0; try{scar=+localStorage.getItem('te_scar')||0;}catch(e){}
  $('#screen').innerHTML='<div class="sysbox" style="animation:none;opacity:1;margin-top:18vh">'+
    '감찰 기록 #45764\n관리 구역 : 이상 없음\n회차 : 001</div>'+
    (scar>0?'<p class="ln q" style="animation:none;opacity:.55;margin-top:14px">…또 지웠구나.</p>':'');
  setTimeout(title,1300);
}
const ENDINGS={
  wall:{t:'벽지',s:'승진\n예정'},
  expose:{t:'게시판의 아침',s:'전단\n살포'},
  collab:{t:'협조자',s:'망각\n처리'},
  sever:{t:'절단',s:'감찰\n중단'},
  soothe:{t:'자진 완화',s:'처치\n완료'},
  dispose:{t:'폐기 처리',s:'회수\n완료'},

  const tail='\n\n비고: 본 기록(#45764)은 초기 감찰분이다. 후속 기록과 세부가 다를 수 있다.\n비고: 인접 기록 간 잔류 오염이 보고되어 있다.\n개봉 알림: 본 단말(lijottoooowww.github.io/tampered-eden)에 게시된다.';
  return (done
    ? '감찰 기록 #45890 — 봉인\n열람 자격: 전 결말 회수 확인.\n비고: 담당자 승진 예정.\n다음 감찰 기록은 소설 『템퍼드 에덴』에서 개봉된다. (공개 준비 중)'
    : '감찰 기록 #45890 — 봉인\n다음 감찰 기록은 소설 『템퍼드 에덴』에서 개봉된다. (공개 준비 중)')+tail;
}
function recordsScreen(back){
  const got=SV.endings, keys=Object.keys(ENDINGS);
  const sealOpen=SV.endings.length>=Object.keys(ENDINGS).length&&SV.frags.length>=3;
  let slots='';
  for(const k of keys){
    const g=got.includes(k);
    if(k==='edge'&&!g){slots+='<div class="slot hidden-slot">???</div>';continue;}
    slots+=g
      ? '<div class="slot got" id="v_'+k+'">'+ENDINGS[k].t+'</div>'
      : '<div class="slot">미도달</div>';
  }
  const fragNames=['사과','전야','수첩'];
  const fragRow=fragNames.map((n,i)=>{
    const g=SV.frags.includes(i+1);
    return '<div class="fragslot'+(g?' got" id="f_'+(i+1)+'"':'"')+'>'+(g?'잔류 기억 — '+n:'▩▩')+'</div>';
  }).join('');
  const trioNames=['기록하는 자','세는 자','재는 자'];
  /* 시스템조차 이 셋의 이름은 온전히 표기하지 못한다 — 열람할 때마다 한 글자만, 랜덤하게 살아남는다 */
  const glitchName=n=>{
    const body=n.slice(0,-2);
    const keep=Math.floor(Math.random()*body.length);
    const junk='$%#@^!*';
    let out='';
    for(let k=0;k<body.length;k++)
      out+=(k===keep)?body[k]:junk[Math.floor(Math.random()*junk.length)];
    return out+' 자';
  };
  const trioRow=trioNames.map((n,i)=>{
    const g=SV.trio>i;
    return '<div class="fragslot'+(g?' got" id="t_'+i+'"':'"')+'>'+(g?'목격 — '+glitchName(n):'▩▩')+'</div>';
  }).join('');
  /* 정정 대장 — 어긋남 도감. 목격→접수 2단, 3회 목격 = 검증 */
  const seenKinds=LEDGER_NAMES.filter((_,i)=>(SV.ledgerS[i]||0)>0).length;
  const verKinds=LEDGER_NAMES.filter((_,i)=>(SV.ledgerS[i]||0)>=3).length;
  let led='';
  LEDGER_NAMES.forEach((nm,i)=>{
    const s=SV.ledgerS[i]||0,f=SV.ledgerF[i]||0;
    led+= s? '<div class="fragslot got'+(s>=3?' verify':'')+'">'+nm+'<br>목격 '+s+' · 접수 '+f+(s>=3?' · <b>검증</b>':'')+'</div>'
           : '<div class="fragslot">▩▩</div>';
  });
  led+='<div class="fragslot" style="opacity:.5;border-style:dotted">'+(verKinds>0?'마지막 칸 — 항목 없음':'▩▩')+'</div>';
  screen(
    '<div class="title-eyebrow" '+dl()+'>RECORD ARCHIVE</div>'+
    P('봉인된 기록. 도달한 결말은 다시 열람할 수 있다.','q')+
    '<div class="stampboard" '+dl()+'><div class="lbl">기록된 결말 — '+got.length+' / '+keys.length+'</div>'+
    '<div class="stampgrid">'+slots+'</div>'+
    '<div class="fragrow">'+fragRow+'</div>'+
    '<div class="fragrow">'+trioRow+'</div>'+
    '<div class="lbl" style="margin-top:18px">정정 대장 — 어긋남 '+seenKinds+' / '+LEDGER_NAMES.length+'</div>'+
    '<div class="ledgergrid">'+led+'</div>'+
    '<div class="lbl" style="margin-top:14px">수신 단편 — '+SV.seenFrags.length+' / '+FRAGS.length+' <span style="opacity:.6">(정정 사이, 스치는 것들)</span></div></div>'+
    (verKinds>0?P('세 번 본 것에는 줄이 생긴다. 줄이 생긴 장부는, 부정하기 어렵다.\n…마지막 칸은 칸만 있고, 항목이 처음부터 없다.','q'):'')+
    (SV.stage>=4&&seenKinds<LEDGER_NAMES.length?P('…빈 칸 몇은, 잊은 눈에만 보인다.','q'):'')+
    (verKinds===LEDGER_NAMES.length?P('열 개의 줄.\n이제 이 장부는, 도시보다 정직하다.','q'):'')+
    BOX(TEASER(),'','LOCKED')+
    (sealOpen?BTN('봉인 기록의 서두를 연다','seal','dim'):'')+
    BTN(back?'돌아간다':'타이틀로','back','ghost'),
    '<span class="l"><b>기록 열람</b></span><span class="r">ARCHIVE</span>'
  );
  $('#back').onclick=back||title;
  const sl=$('#seal'); if(sl)sl.onclick=()=>sealScreen(back);
  keys.forEach(k=>{const el=document.querySelector('#v_'+k); if(el)el.onclick=()=>viewEnding(k,back);});
  [1,2,3].forEach(n=>{const el=document.querySelector('#f_'+n); if(el)el.onclick=()=>viewFrag(n,back);});
  [0,1,2].forEach(i=>{const el=document.querySelector('#t_'+i); if(el)el.onclick=()=>viewTrio(i,back);});
}

    (SV.corrVisits>=2?'\n…목록이, 늘었다. 인쇄된 목록이 늘어날 수 있나.':'');
  SV.lastClaims=SV.lastClaims||[];
  let pool=CLAIMS.map((_,i)=>i).filter(i=>!SV.lastClaims.includes(i));
  if(pool.length<2)pool=CLAIMS.map((_,i)=>i);
  const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];

  SV.lastClaims=[a,b];

     기독 마킹은 비트가 실제 렌더될 때(beat) 찍는다 — 배정만 하고 이탈한 회차는 초회로 남는다 */
  const mk=idx=>{
    const c=CLAIMS[idx];
    const seen=SV.claimsSeen.includes(idx);
    if(!(seen&&c.t2))return {t:c.t,ch:c.ch,ci:idx};

    /* 3회차부터는 변주도 반복이다 — 반복임을 아는 문장으로 */
    if((SV.claimsTwice||[]).includes(idx))
      return {t:'민원 — 낯익은 얼굴.\n같은 민원. 같은 서식.\n…당신만, 세고 있다.',ch:ch,ci:idx};
    let t=c.t2;
    if(idx===0&&SV.marginKept)t+='\n서랍 제일 안쪽에는, 그 서식이 아직 있다.\n여백까지 꽉 찬 채로.';
    return {t:t,ch:ch,ci:idx,tw:idx};
  };
  const beats=[mk(a),mk(b)];
  save();
  return {id:'correct',loc:'시민민원국 정정과',intro:intro,beats:beats};

/* 직업 비트 3종 풀에서 회차마다 2개 — 같은 자리, 조금 다른 하루.

function jobWith(j){
  if(j.beats.length<=2)return j;
  SV.lastCut=SV.lastCut||{};
  const prev=SV.lastCut[j.id];
  let cands=j.beats.map((_,i)=>i);
  if(prev!==undefined&&cands.length>1)cands=cands.filter(i=>i!==prev);
  const cut=cands[Math.floor(Math.random()*cands.length)];
  SV.lastCut[j.id]=cut; save();
  const bs=j.beats.filter((_,i)=>i!==cut);
  return {id:j.id,loc:j.loc,intro:j.intro,beats:bs};
}
function pickJob(){
  SV.lastJobs=SV.lastJobs||[];
  const ids=JOBS.map(j=>j.id).concat('correct');

  const id=pool.length?pick(pool):pick(ids);
  SV.lastJobs.push(id); if(SV.lastJobs.length>2)SV.lastJobs.shift(); save();
  return id==='correct'?corrJob():jobWith(JOBS.find(j=>j.id===id));

function pickInc(){

  if(SV.echo){ SV.echo=false; save();

  const warn=SV.expo>=12?P('이제, 세는 것을 숨기지도 않는다.\n골목 어귀의 사람이 수첩을 꺼내 들었다. 당신을 보면서.','q')
    :SV.expo>=9?P(pick(['요즘, 같은 얼굴을 하루에 두 번 본다.\n우연이겠지. 우연이, 사흘째다.','퇴근길, 뒤에서 걸음 소리가 당신과 같은 박자로 걷는다.\n박자를 바꿔 본다. 따라온다.']),'q')
    :SV.expo>=6?P('출근길, 같은 제복을 오늘 세 번 보았다.\n세 번 다, 다른 사람이었다.\n…같은 시선이었다.','q'):'';
  screen(

    saltLine+

    intro+stageLine+warn+

function beat(i){
  /* 파편 해금 체크 */
  if(SV.susp>=4&&!SV.frags.includes(1)){memFrag(1,()=>beat(i));return;}
  if(SV.susp>=8&&!SV.frags.includes(2)){memFrag(2,()=>beat(i));return;}
  if(SV.susp>=12&&!SV.frags.includes(3)){memFrag(3,()=>beat(i));return;}
  /* 세 사람 목격 (stage2+, 3회 한정) */
  if(SV.stage>=2&&SV.trio<3&&Math.random()<0.22){G.sp=1;trioScene(()=>beat(i));return;}
  /* 수기 견습 목격 (stage2+, 1회 한정) */
  if(SV.stage>=2&&!SV.scribeSeen&&Math.random()<0.15){G.sp=1;scribeScene(()=>beat(i));return;}
  /* 흔적 조우 */
  if(Math.random()<0.15){G.sp=1;traceScene(()=>beat(i));return;}
  /* 온기 비트 — 스탯 없음, 3회 한정 */
  if(SV.warmSeen.length<3&&Math.random()<0.12){G.sp=1;warmScene(()=>beat(i));return;}
  /* 압박 비트 — 스탯 없음, 3회 한정 */
  if(SV.pressSeen.length<3&&Math.random()<0.12){G.sp=1;pressScene(()=>beat(i));return;}
  /* 피티 — 회차당 고유 이벤트 최소 1회 보장 */
  if(i===1&&!G.sp){
    G.sp=1;
    if(SV.stage>=2&&SV.trio<3){trioScene(()=>beat(i));return;}
    if(SV.stage>=2&&!SV.scribeSeen){scribeScene(()=>beat(i));return;}
    if(SV.warmSeen.length<3){warmScene(()=>beat(i));return;}
    traceScene(()=>beat(i));return;
  }
  if(i>=G.job.beats.length){incident();return;}
  const b=G.job.beats[i];
  if(b.ci!==undefined&&!SV.claimsSeen.includes(b.ci)){SV.claimsSeen.push(b.ci);save();}
  if(b.tw!==undefined&&!(SV.claimsTwice||[]).includes(b.tw)){SV.claimsTwice=SV.claimsTwice||[];SV.claimsTwice.push(b.tw);save();}
  let html=P(b.t);
  b.ch.forEach((c,ci)=>{html+=BTN(c.l,'c'+ci,ci===1?'dim':'');});
  screen(html);
  b.ch.forEach((c,ci)=>{
    $('#c'+ci).onclick=()=>{
      if(c.th)thud();
      if(c.flag){SV[c.flag]=true;save();}
      fx(c.fx);
      screen(P(c.rx)+BTN(i+1<G.job.beats.length?'계속':'저녁','n'));
      $('#n').onclick=()=>beat(i+1);
    };
  });
}

  if(G.curIncIdx===undefined)G.curIncIdx=pickInc();
  const inc=INCIDENTS[G.curIncIdx];
  if(!G.ledgerMark){SV.ledgerS[G.curIncIdx]=(SV.ledgerS[G.curIncIdx]||0)+1;G.ledgerMark=1;save();}
  const again=G.ignoredHere>0||G.toldBelow;
  screen(
    P((again?'또다.\n':'')+inc.t)+
    (SV.stage>=3?P('낯설지가 않다. 낯설지 않다는 게 제일 낯설다.','q'):
     SV.stage===2?P('본 적 있는 종류다.\n"종류"라는 게, 생겼다.','q'):'')+

    BTN('신고한다','go')+

    collab:'미안하다. 내가 넘겼다.',
    soothe:'더 보고 싶지 않아서, 그렇게 적었다.',
    dispose:'회수반이 왔다. 그런데 나는 아직 여기 있다.',
    empty:'아무도 나를 못 본다. 이 글씨는 보이려나.',
    wander:'점을 이어 봐라. 길이 나온다. 나는 걷는 중이다.',
    edge:'가장자리에 가 봐라. 소리가 나지 않는 곳이 있다.'
  }[key];
  if(tr&&!SV.traces.includes(tr))SV.traces.push(tr);
  /* 협조자: 기억이 지워진다 — 침식 단계 후퇴 */
  /* 협조자 — 완화 처치가 예전만큼 깊게 안 먹힌다. 잔류 단계(stage2)에서 깨어나 3~4리셋이면 재각성 */
  if(key==='collab'){SV.stage=2;SV.prog=3;SV.reports=0;SV.records=0;SV.foundTraces=false;SV.betrayUnlocked=false;SV.susp=Math.min(SV.susp,3);}
